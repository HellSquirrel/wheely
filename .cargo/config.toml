[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# No debug probe: `cargo run --release` loads the ELF over USB into a Pico that
# is in BOOTSEL mode (hold BOOTSEL while plugging in), verifies, and reboots it.
runner = "picotool load -u -v -x -t elf"
# With a Debug Probe attached, use this instead (flash + stream defmt over RTT):
#runner = "probe-rs run --chip RP235x"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "info"
